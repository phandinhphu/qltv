spring.datasource.url=${DEV_DB_URL}
spring.datasource.username=${DEV_DB_USERNAME}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.datasource.driver-class-name=${DEV_DB_DRIVER}

jwt.secret=${DEV_JWT_SECRET}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
logging.level.fpt.training.qltv=DEBUG
server.error.include-stacktrace=always

cloudinary.cloud-name=${DEV_CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${DEV_CLOUDINARY_API_KEY}
cloudinary.api-secret=${DEV_CLOUDINARY_API_SECRET}

app.storage.private-path=${DEV_STORAGE_PRIVATE_PATH:storage/private}
