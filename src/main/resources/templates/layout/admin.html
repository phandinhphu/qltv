<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="page(title, content)">
<th:block th:fragment="head(title)">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${title}">QTLV Admin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </head>
</th:block>
<th:block th:replace="~{layout/admin :: head(${title})}"></th:block>

<body class="admin-body">
    <div class="page-shell">
        <div th:replace="~{fragments/admin/header :: header}"></div>
        <div class="admin-shell">
            <aside class="admin-sidebar" th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
            <section class="admin-content">
                <div th:replace="~{fragments/shared/common :: alerts}"></div>
                <div th:replace="${content}"></div>
            </section>
        </div>
        <div th:replace="~{fragments/admin/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
