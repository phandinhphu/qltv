<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/client :: page('Đăng ký', ~{::content})}">
<th:block th:fragment="content">
<main class="container py-5 auth-shell">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card app-card auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3">QLTV</div>
                        <p class="app-muted mb-0">Đăng ký thẻ thư viện để bắt đầu hành trình đọc sách</p>
                    </div>
                    <h1 class="h3 fw-bold mb-4">Đăng ký tài khoản</h1>
                    <form id="registerForm" class="vstack gap-3">
                        <input class="form-control form-control-lg" type="text" id="username" name="username" placeholder="Username" required>
                        <input class="form-control form-control-lg" type="email" id="email" name="email" placeholder="Email" required>
                        <input class="form-control form-control-lg" type="password" id="password" name="password" placeholder="Password" required>
                        <button class="btn btn-primary btn-lg" type="submit">Đăng ký</button>
                        <div id="error" class="alert alert-danger d-none mb-0"></div>
                    </form>
                    <div class="mt-3">
                        <a th:href="@{/login}">Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    const errorBox = document.getElementById('error');
    errorBox.classList.add('d-none');

    try {
        const resp = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (resp.status === 201) {
            window.location.href = '/login';
        } else {
            const err = await resp.json();
            errorBox.textContent = err.message || 'Registration failed';
            errorBox.classList.remove('d-none');
        }
    } catch (ex) {
        errorBox.textContent = ex.message;
        errorBox.classList.remove('d-none');
    }
});
</script>
</main>
</th:block>
</html>
