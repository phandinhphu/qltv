<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/client :: page('Đăng nhập', ~{::content})}">
<th:block th:fragment="content">
<main class="container py-5 auth-shell">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card app-card auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3">QLTV</div>
                        <p class="app-muted mb-0">Đăng nhập để mượn sách và quản lý tài khoản</p>
                    </div>
                    <h1 class="h3 fw-bold mb-4">Đăng nhập</h1>
                    <form th:action="@{/login}" method="post" class="vstack gap-3">
                        <input class="form-control form-control-lg" type="text" id="username" name="username" placeholder="Username" required>
                        <input class="form-control form-control-lg" type="password" id="password" name="password" placeholder="Password" required>
                        <button class="btn btn-primary btn-lg" type="submit">Đăng nhập</button>
                    </form>
                    <div class="alert alert-danger mt-3 mb-0" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu</div>
                    <div class="mt-3">
                        <a th:href="@{/register}">Tạo tài khoản mới</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</th:block>
</html>
