<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/client :: page('Cập nhật profile', ~{::content})}">
<th:block th:fragment="content">
    <section class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h1 class="h4 mb-1">Cập nhật profile</h1>
                        <p class="app-muted mb-0">Quản lý thông tin đăng nhập và email.</p>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/profile}" method="post" th:object="${profile}">
                            <th:block th:replace="~{fragments/shared/common :: csrf}"></th:block>

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" th:field="*{username}" placeholder="Username">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="Email">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" th:value="${userInfo.role}" readonly>
                            </div>

                            <div class="border-top pt-3">
                                <h2 class="h6 mb-3">Đổi mật khẩu (không bắt buộc)</h2>
                                <div class="mb-3">
                                    <label class="form-label">Mật khẩu hiện tại</label>
                                    <input type="password" class="form-control" th:field="*{currentPassword}" placeholder="Nhập mật khẩu hiện tại">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mật khẩu mới</label>
                                    <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Nhập mật khẩu mới">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Xác nhận mật khẩu mới</label>
                                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>
</html>
