<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/admin :: page('Thùng rác - Quản lý danh mục', ~{::content})}">
<th:block th:fragment="content">
    <main>
        <div class="d-flex justify-content-between align-items-end mb-3">
            <div>
                <h1 class="h3 mb-1">Thùng rác (Danh mục đã xóa)</h1>
                <p class="app-muted mb-0">Danh sách danh mục đã xóa mềm, bạn có thể khôi phục lại.</p>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Quay lại danh sách</a>
        </div>

        <div class="card app-card app-table">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tên</th>
                            <th>Mô tả</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="category : ${categories}">
                            <td th:text="${category.name}">Name</td>
                            <td th:text="${category.description}">Description</td>
                            <td class="text-end">
                                <form class="d-inline" th:action="@{/admin/categories/{id}/restore(id=${category.id})}"
                                    method="post">
                                    <th:block th:replace="~{fragments/shared/common :: csrf}"></th:block>
                                    <button class="btn btn-sm btn-outline-success">Khôi phục</button>
                                </form>
                                <form class="d-inline ms-1" th:action="@{/admin/categories/{id}/force(id=${category.id})}"
                                    method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa vĩnh viễn danh mục này không? Thao tác này không thể hoàn tác!')">
                                    <th:block th:replace="~{fragments/shared/common :: csrf}"></th:block>
                                    <button class="btn btn-sm btn-outline-danger">Xóa vĩnh viễn</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${categories.isEmpty()}">
                            <td colspan="3" class="text-center py-4 text-muted">Thùng rác trống</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</th:block>
</html>
