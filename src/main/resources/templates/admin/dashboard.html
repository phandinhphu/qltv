<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: page('Dashboard', ~{::content})}">
<th:block th:fragment="content">
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Dashboard</h1>
            <p class="app-muted mb-0">Tổng quan hoạt động thư viện.</p>
        </div>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-md-3"><div class="card app-card stat-card"><div class="card-body"><div class="app-muted">Tổng sách</div><div class="display-6 fw-bold" th:text="${dashboard.totalBooks}">0</div></div></div></div>
        <div class="col-md-3"><div class="card app-card stat-card"><div class="card-body"><div class="app-muted">Tổng user</div><div class="display-6 fw-bold" th:text="${dashboard.totalUsers}">0</div></div></div></div>
        <div class="col-md-3"><div class="card app-card stat-card"><div class="card-body"><div class="app-muted">Đang mượn</div><div class="display-6 fw-bold" th:text="${dashboard.totalActiveBorrows}">0</div></div></div></div>
        <div class="col-md-3"><div class="card app-card stat-card"><div class="card-body"><div class="app-muted">Quá hạn</div><div class="display-6 fw-bold" th:text="${dashboard.totalOverdue}">0</div></div></div></div>
    </div>
    <div class="card app-card">
        <div class="card-body">
            <h2 class="h5">Top sách mượn nhiều nhất</h2>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between" th:each="book : ${dashboard.topBorrowedBooks}"><span th:text="${book.title}">Book</span><span th:text="${book.avgRating}">0</span></li>
            </ul>
        </div>
    </div>
</main>
</th:block>
</html>
