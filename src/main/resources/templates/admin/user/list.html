<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: page('Quản lý người dùng', ~{::content})}">
<th:block th:fragment="content">
<main>
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h1 class="h3 mb-1">Quản lý người dùng</h1>
            <p class="app-muted mb-0">Quản trị tài khoản và trạng thái.</p>
        </div>
    </div>
    <div class="card app-card app-table">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light"><tr><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th></th></tr></thead>
                <tbody>
                <tr th:each="user : ${pageData.content}">
                    <td th:text="${user.username}">Username</td>
                    <td th:text="${user.email}">Email</td>
                    <td th:text="${user.role}">Role</td>
                    <td th:text="${user.active}">true</td>
                    <td class="text-end">
                        <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post">
                            <th:block th:replace="~{fragments/shared/common :: csrf}"></th:block>
                            <button class="btn btn-sm btn-outline-primary">Bật/Tắt</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{fragments/shared/pagination :: pagination('/admin/users', ${pageData}, ${queryParams})}"></div>
</main>
</th:block>
</html>
