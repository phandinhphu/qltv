<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="book-card(book, showStatus, actionUrl)" class="card app-card h-100 book-card">
    <img th:if="${book.coverImageUrl != null}" th:src="${book.coverImageUrl}" class="card-img-top book-cover" alt="Cover">
    <div class="card-body d-flex flex-column">
        <div class="d-flex align-items-start justify-content-between gap-2">
            <h5 class="card-title" th:text="${book.title}">Title</h5>
            <span th:if="${showStatus}" class="badge text-bg-primary" th:text="${book.status}">AVAILABLE</span>
        </div>
        <p class="card-text small app-muted mb-3" th:text="${book.description}">Description</p>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="text-uppercase small text-muted" th:text="${book.language}">Language</span>
            <a class="btn btn-sm btn-outline-primary" th:href="${actionUrl}">Chi tiết</a>
        </div>
    </div>
</div>
</body>
</html>
